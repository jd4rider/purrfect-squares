<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta
      name="description"
      content="Purrfect Squares — a cozy cat logic puzzle. Drag rectangles around numbered cats until every square is covered. 200 validated levels, daily puzzles and no timer. Play free in your browser."
    />
    <meta name="theme-color" content="#fdf8e7" />
    <meta property="og:title" content="Purrfect Squares — cozy cat rectangles" />
    <meta property="og:description" content="Numbered cats, wooden tiles, no timer. Draw one rectangle per cat and cover the whole board." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://purrfectsquares.littlejoyarcade.site/" />
    <title>Purrfect Squares</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fdf8e7;
        overflow: hidden;
        touch-action: none;
      }
      body {
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box;
      }
      #game canvas {
        display: block;
        margin: 0 auto;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/phaser/main.js"></script>
    <script src="./arcade-client.js" data-game-id="purrfect-squares"></script>
  </body>
</html>
